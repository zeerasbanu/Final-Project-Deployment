
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Read Story | BlogSpace</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    header {
      background: white;
      padding: 20px 8%;
      border-bottom: 1px solid #e2e8f0;
    }

    header a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 850px;
      margin: 40px auto;
      padding: 35px;
      background: white;
      border-radius: 16px;
    }

    h1 {
      font-size: 36px;
      line-height: 1.2;
    }

    .story-meta {
      color: #64748b;
      margin-bottom: 25px;
    }

    .cover-image {
      width: 100%;
      max-height: 430px;
      object-fit: cover;
      border-radius: 12px;
    }

    .story-content {
      white-space: pre-wrap;
      line-height: 1.9;
      font-size: 17px;
      overflow-wrap: anywhere;
      margin-top: 25px;
    }

    #errorMessage {
      color: #dc2626;
    }

    @media (max-width: 600px) {
      main {
        margin: 15px;
        padding: 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Back to BlogSpace</a>
  </header>

  <main>
    <p id="loadingMessage">Loading story...</p>
    <p id="errorMessage" role="alert"></p>

    <article id="blogDetails" hidden>
      <h1 id="blogTitle"></h1>

      <div class="story-meta">
        <p id="blogCategory"></p>
        <p id="blogDate"></p>
      </div>

      <img
        id="blogImage"
        class="cover-image"
        alt=""
        hidden
      >

      <h3 id="blogExcerpt"></h3>

      <div
        id="blogContent"
        class="story-content"
      ></div>
    </article>
  </main>

    <script src="js/main.js" defer></script>
    <script src="js/blog.js" defer></script>
    <script src="js/blog-details.js" defer></script>

</body>
</html>
